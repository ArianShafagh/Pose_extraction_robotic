# ChArUco board used for per-camera intrinsic calibration: charuco_A3.pdf
# (3x2 squares on A3, generated with OpenCV's layout - verified pixel-exact against the PDF).
# Sizes are the PDF values at 100% print scale. If the printer scaled the page,
# measure one square on the PRINT with a ruler and scale both lengths accordingly.
squares_x: 3
squares_y: 2
square_len_m: 0.115     # 115 mm
marker_len_m: 0.0862    # 86.2 mm (0.75 x square)
dictionary: DICT_4X4_50 # marker ids 0, 1, 2
legacy_pattern: false
# A 3x2 board has only 2 inner chessboard corners, so the 4 corners of each of
# the 3 markers are used as well -> up to 14 points per frame.
use_marker_corners: true
