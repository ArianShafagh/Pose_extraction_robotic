[project]
name = "moppose"
version = "0.1.0"
description = "Multi-camera (fisheye) 3D pose extraction of a person mopping"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opencv-contrib-python>=4.10,<5",
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Person detection/tracking (YOLO26) + RTMW whole-body pose (ONNX).
pose = [
    "torch>=2.7,<2.15",  # 2.15 drops the CUDA 12.6 builds (needed for GTX 10xx)
    "torchvision>=0.22",
    "ultralytics>=8.3.200",
    "rtmlib>=0.0.13",
    "onnxruntime-gpu>=1.21,<1.24",  # CUDA 12 builds (match the CUDA 12 PyTorch)
    "lap>=0.5",  # BoT-SORT tracker dependency (ultralytics would auto-install it)
]
# Sapiens2 pose (code is cloned to third_party/sapiens2 by `moppose setup`;
# these are its runtime dependencies).
sapiens = [
    "moppose[pose]",
    "safetensors>=0.4",
    "transformers>=4.50",
    "timm>=1.0",
    "accelerate>=1.0",
    "iopath",
    "prettytable",
    "termcolor",
    "rich",
    "pillow",
    "huggingface_hub>=0.30",
]
viz = ["rerun-sdk>=0.20"]

[project.scripts]
moppose = "moppose.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

# CUDA 12.6 PyTorch wheels: support GTX 10xx (Pascal, sm_61) up to RTX 40xx.
# (The cu128 builds dropped Pascal, i.e. the GTX 1080 of the GPU computer.)
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv]
# rtmlib/ultralytics depend on the CPU-only "onnxruntime", which would overwrite
# onnxruntime-gpu (same module name). Never install it.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moppose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
