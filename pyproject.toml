[project]
name = "moppose"
version = "0.1.0"
description = "Multi-camera (fisheye) 3D pose extraction of a person mopping"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "opencv-contrib-python>=4.10,<5",
    "numpy>=1.26,<2.3",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tqdm>=4.66",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
yolo = ["ultralytics>=8.3"]
rtm = ["rtmlib>=0.0.13", "onnxruntime-gpu>=1.18"]
viz = ["rerun-sdk>=0.20"]

[project.scripts]
moppose = "moppose.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moppose"]

[tool.pytest.ini_options]
testpaths = ["tests"]
